# Nahda Publications — single CI/CD flow
#
# Flow:
#   1) quality  → install → lint → typecheck → build
#   2) preview  → Vercel preview deploy (pull requests only)
#   3) production → migrate (if present) → Vercel production (push to main)
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
#   DATABASE_URL          (production Neon URL — migrate job only)
#
# Optional (build already uses placeholders; set these if you want a closer prod build):
#   AUTH_SECRET, NEXT_PUBLIC_APP_URL, CLOUDINARY_*, SMTP_*, STRIPE_*

name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Safe placeholders so `next build` / `prisma generate` can run without real secrets
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nahda_ci?sslmode=disable
  AUTH_SECRET: ci-auth-secret-change-me-in-production-32chars
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  CLOUDINARY_CLOUD_NAME: ci
  CLOUDINARY_API_KEY: "000000000000000"
  CLOUDINARY_API_SECRET: ci-secret
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: ci@example.com
  SMTP_PASS: ci-pass
  SMTP_FROM: "Nahda CI <ci@example.com>"
  STRIPE_SECRET_KEY: sk_test_ci
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci

jobs:
  # ─────────────────────────────────────────────
  # 1. Quality gate (always)
  # ─────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # ─────────────────────────────────────────────
  # 2. Preview deploy (PRs)
  # ─────────────────────────────────────────────
  preview:
    name: Deploy preview (Vercel)
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project (preview)
        id: pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping preview deploy — set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Build on Vercel
        if: steps.pull.outputs.skipped != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        if: steps.pull.outputs.skipped != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # 3. Production (push to main)
  # ─────────────────────────────────────────────
  production:
    name: Migrate · Deploy production (Vercel)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipping migrate — set DATABASE_URL secret for production migrations."
            exit 0
          fi
          if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            npx prisma migrate deploy
          else
            echo "No prisma/migrations yet — skipping migrate deploy."
            echo "Create migrations with: npm run db:migrate"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project (production)
        id: pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping production deploy — set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Build on Vercel (production)
        if: steps.pull.outputs.skipped != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        if: steps.pull.outputs.skipped != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
